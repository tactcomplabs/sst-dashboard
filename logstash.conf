input {
  # Listen for Jenkins pushing JSON data via TCP
  tcp {
    port => 5044
    codec => json
  }
}

filter {
  if [message] {
    grok {
      match => { "message" => "###SST_BENCH_PERF_V1###(?<sst_perf_raw>.+?)###END###" }
      tag_on_failure => []
    }
    if [sst_perf_raw] {
      json {
        source => "sst_perf_raw"
        target => "sst_bench_perf"
        remove_field => ["sst_perf_raw"]
        tag_on_failure => ["_sst_perf_jsonfail"]
      }
      if "_sst_perf_jsonfail" not in [tags] {
        mutate {
          add_field => {
            "[@metadata][doc_id]" => "%{[sst_bench_perf][run_id]}-%{[sst_bench_perf][jobid]}-%{[sst_bench_perf][jobtype]}"
          }
        }
      }
    }
  }
}

output {
  if [@metadata][doc_id] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "jenkins-%{+YYYY.MM.dd}"
      document_id => "%{[@metadata][doc_id]}"
    }
  } else {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "jenkins-%{+YYYY.MM.dd}"
    }
  }
}
