input {
  # Listen for Jenkins pushing JSON data via TCP
  tcp {
    port => 5044
    codec => json
  }
}

filter {
  # The plugin sends a 'data' object. We can clean it up if needed.
  # This section is where you can add tags or parse specific log lines.
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "jenkins-%{+YYYY.MM.dd}"
  }

}
